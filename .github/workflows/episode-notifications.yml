name: WatchTrack episode notifications

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for new episodes
        run: |
          curl --fail --silent --show-error --retry 2 \
            https://watchtrack-v2-git.pages.dev/api/check-notifications
