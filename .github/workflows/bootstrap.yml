name: Bootstrap WatchTrack source

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore project files
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f bootstrap/watchtrack.zip.b64.part1 ]; then
            echo "Bootstrap already completed."
            exit 0
          fi
          cat bootstrap/watchtrack.zip.b64.part* > /tmp/watchtrack.zip.b64
          base64 --decode /tmp/watchtrack.zip.b64 > /tmp/watchtrack.zip
          unzip -o /tmp/watchtrack.zip -d .
          rm -rf bootstrap
      - name: Commit restored source
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import WatchTrack v2 source"
          git push
